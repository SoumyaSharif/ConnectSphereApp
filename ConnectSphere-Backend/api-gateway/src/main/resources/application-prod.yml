spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          - id: auth-service
            uri: lb://auth-user-service
            predicates:
              - Path=/api/v1/auth/**, /api/v1/users/**
          - id: post-service
            uri: lb://post-service
            predicates:
              - Path=/api/v1/posts/**
          - id: comment-service
            uri: lb://comment-service
            predicates:
              - Path=/api/v1/comments/**
          - id: like-service
            uri: lb://like-service
            predicates:
              - Path=/api/v1/likes/**
          - id: follow-service
            uri: lb://follow-service
            predicates:
              - Path=/api/v1/follows, /api/v1/follows/**
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/v1/notifications/**
          - id: media-service
            uri: lb://media-service
            predicates:
              - Path=/api/v1/media/**, /api/v1/stories/**
          - id: search-service
            uri: lb://search-service
            predicates:
              - Path=/api/v1/search/**, /api/v1/hashtags/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:https://connectsphere.com},https://www.connectsphere.com}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway
  endpoint:
    health:
      show-details: always
