spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      mvc:
        routes:
          # Auth / User Service
          - id: auth-service
            uri: lb://auth-user-service
            predicates:
              - Path=/api/v1/auth/**, /api/v1/users/**

          # Post Service
          - id: post-service
            uri: lb://post-service
            predicates:
              - Path=/api/v1/posts/**

          # Comment Service
          - id: comment-service
            uri: lb://comment-service
            predicates:
              - Path=/api/v1/comments/**

          # Like Service
          - id: like-service
            uri: lb://like-service
            predicates:
              - Path=/api/v1/likes/**

          # Follow Service
          - id: follow-service
            uri: lb://follow-service
            predicates:
              - Path=/api/v1/follows/**

          # Notification Service
          - id: notification-service
            uri: lb://notification-service
            predicates:
              - Path=/api/v1/notifications/**

          # Media / Story Service
          - id: media-service
            uri: lb://media-service
            predicates:
              - Path=/api/v1/media/**, /api/v1/stories/**

          # Search / Hashtag Service
          - id: search-service
            uri: lb://search-service
            predicates:
              - Path=/api/v1/search/**, /api/v1/hashtags/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.connectsphere: DEBUG
